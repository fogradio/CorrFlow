# ImageNet sampling with the refiner active over the full [0, 1] interval.
# Replace @EPOCH@ with the zero-padded training epoch before use.
stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: pretrained_models/stage1/imagenet/dinov3l-k7/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: pretrained_models/stage1/imagenet/dinov3l-k7/stats.pt

stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size: [1, 1]
    in_channels: 1024
    hidden_size: [1440, 2048]
    depth: [28, 2]
    num_heads: [20, 16]
    mlp_ratio: 4.0
    base_model_depth: 8
  # instantiate_from_config picks the "ema" key out of the training checkpoint.
  ckpt: ckpts/stage2/in256-k7-ft-refiner/checkpoints/ep-@EPOCH@.pt

refiner:
  model:
    target: stage2.refiner.Refiner
    params:
      dim: 768
      depth: 10
      num_heads: 12
      mlp_ratio: 4.0
      zero_init_output: true
      normalize_selected_hidden: false
      inject_selected_hidden: false
      drop_condition: false
    # Flat state dict of the EMA refiner (engine.py save_refiner_weights).
    ckpt: ckpts/stage2/in256-k7-ft-refiner/checkpoints/refiner/refiner_ep-@EPOCH@.pt
  selected_layers: [3, 11, 19, 27]
  t_min: 0.0
  t_max: 1.0
  input_v_prediction: false
  eval_ab: true                      # -> two CSVs: _ema (off) and _ema_refiner (on)
  sampling:
    scale: 1.0                       # injected after IG -> effective factor is exactly 1.0
    t_min: 0.0
    t_max: 1.0
    trust_rho: 0.0
    use_ema: true

conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8

transport:
  prediction: x
  time_dist_type: logit-normal_0_1

sampler:
  num_steps: 100

guidance:
  cfg: {scale: 1.0, t_min: 0.0, t_max: 1.0}     # scale <= 1.0 -> CFG disabled
  ig:  {scale: 1.78, t_min: 0.10, t_max: 1.0}   # paper's "REPA guidance"

dataset:
  target: imagenet
  type: hf
  data_dir: ${oc.env:IMAGENET_DATA_DIR,data/imagenet-256}
  split: train
  condition_type: label
  shared_tmpdir: ${oc.env:CORRFLOW_TMPDIR,tmp}

training:
  epochs: 80
  global_batch_size: 512
  grad_accum_steps: 1
  num_workers: 8
  global_seed: 42
  image_size: 256

eval:
  eval_model: false
  eval_dir: results/stage2/offline_eval
  datasets:
    imagenet:
      type: hf
      data_dir: ${oc.env:IMAGENET_DATA_DIR,data/imagenet-256}
      split: val
      condition_type: label
      num_samples: 50000     # full val -> all 1000 classes
      # fid / inception_score are Inception-v3; fd_dinov2_cls is the raw
      # Frechet distance in DINOv2 ViT-L CLS space (what papers call FDD /
      # FD-DINOv2) and fdr_dinov2_cls is the same number divided by FD-loss's
      # norm_const 14.19, i.e. 1.0 == real ImageNet-256 val.
      metrics: [fid, inception_score, fd_dinov2_cls, fdr_dinov2_cls]

misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
