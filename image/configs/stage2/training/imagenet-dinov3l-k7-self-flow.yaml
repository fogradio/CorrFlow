# RAEv2 latent-space Self-Flow on ImageNet-256. Stage 1 is frozen and stage 2
# starts from scratch; --ckpt is reserved for resuming this experiment.
stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3mls-vit-l16[layers=11.13.15.17.19.21.23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: pretrained_models/stage1/imagenet/dinov3l-k7/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: pretrained_models/stage1/imagenet/dinov3l-k7/stats.pt

stage_2:
  target: stage2.models.SelfFlowDiT
  params:
    input_size: 16
    patch_size: 1
    in_channels: 1024
    hidden_size: 1280
    depth: 30
    num_heads: 20
    mlp_hidden_size: 4784

self_flow:
  enabled: true
  mask_ratio: 0.25
  representation_loss_weight: 0.8
  student_layer: 9
  teacher_layer: 21
  expected_num_parameters: 875216500
  parameter_tolerance: 0.001

conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8

transport:
  prediction: velocity
  time_dist_type: logit-normal_0_1
  t_eps: 0.05

sampler:
  num_steps: 50

guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
  ig: null

dataset:
  target: imagenet
  type: hf
  data_dir: ${oc.env:IMAGENET_DATA_DIR,data/imagenet-256}
  split: train
  condition_type: label
  shared_tmpdir: ${oc.env:CORRFLOW_TMPDIR,tmp}

training:
  epochs: 80
  global_batch_size: 1024
  # 1024 / (8 GPUs * 8 accumulation steps) = 16 images/GPU/micro-step.
  grad_accum_steps: 8
  ema_decay: 0.9995
  num_workers: 8
  log_interval: 100
  checkpoint_interval: 10
  # Approximately one fixed EMA visualization every 10 epochs.
  sample_every: 12510
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 0.00002
    warmup_from_zero: false
  image_size: 256

# Full distributional evaluation is intentionally disabled during training.
eval: null

misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  # sqrt(262144 / 4096) = logit-normal train/sampling shift 8.
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
